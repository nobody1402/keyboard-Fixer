name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AutoHotkey v2
        uses: mdcampbell/ahk2exe@v1
        with:
          in: keyboard-fixer.ahk
          out: keyboard-fixer.exe
          base: v2

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-fixer-exe
          path: keyboard-fixer.exe
