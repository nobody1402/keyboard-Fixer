name: Build EXE

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey
        run: choco install autohotkey --yes

      - name: Find Ahk2Exe
        run: |
          Get-ChildItem "C:\Program Files" -Recurse -Filter Ahk2Exe.exe

      - name: Compile to EXE
        run: |
          & "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe" /in keyboard-fixer.ahk /out keyboard-fixer.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-fixer-exe
          path: keyboard-fixer.exe
