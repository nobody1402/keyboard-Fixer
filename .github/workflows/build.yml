name: Build EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2 (interpreter)
        run: choco install autohotkey -y --no-progress

      - name: Locate v2 base exe and download Ahk2Exe compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ahkRoot = "C:\Program Files\AutoHotkey"
          if (-not (Test-Path $ahkRoot)) {
            $ahkRoot = "C:\Program Files (x86)\AutoHotkey"
          }
          Write-Host "AutoHotkey root: $ahkRoot"
          Write-Host "--- Full contents ---"
          Get-ChildItem -Path $ahkRoot -Recurse | Select-Object FullName

          # فایل base باید حتماً از پوشه v2 باشه (نه v1.1 که در ریشه هست)
          $v2Dir = Join-Path $ahkRoot "v2"
          if (-not (Test-Path $v2Dir)) {
            Write-Error "پوشه v2 پیدا نشد؛ یعنی نسخه‌ی 2 نصب نشده. محتویات بالا رو ببین."
            exit 1
          }
          $baseExe = Get-ChildItem -Path $v2Dir -Filter "AutoHotkey64.exe" -Recurse | Select-Object -First 1
          if (-not $baseExe) {
            $baseExe = Get-ChildItem -Path $v2Dir -Filter "AutoHotkey*.exe" -Recurse | Select-Object -First 1
          }
          if (-not $baseExe) {
            Write-Error "هیچ فایل base ای زیر پوشه v2 پیدا نشد."
            exit 1
          }
          Write-Host "Base exe (v2) at: $($baseExe.FullName)"
          echo "AHK_BASE_PATH=$($baseExe.FullName)" >> $env:GITHUB_ENV

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          Write-Host "Downloading: $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\Ahk2Exe.zip"

          $compilerDir = Join-Path $ahkRoot "Compiler"
          New-Item -ItemType Directory -Force -Path $compilerDir | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\Ahk2Exe.zip" -DestinationPath $compilerDir -Force

          $ahk2exe = Get-ChildItem -Path $compilerDir -Filter "Ahk2Exe.exe" -Recurse | Select-Object -First 1
          if (-not $ahk2exe) {
            Write-Error "Ahk2Exe.exe extraction failed."
            exit 1
          }
          Write-Host "Ahk2Exe.exe at: $($ahk2exe.FullName)"
          echo "AHK2EXE_PATH=$($ahk2exe.FullName)" >> $env:GITHUB_ENV

      - name: Compile to EXE
        shell: powershell
        run: |
          Write-Host "Compiler: $env:AHK2EXE_PATH"
          Write-Host "Base:     $env:AHK_BASE_PATH"

          $proc = Start-Process -FilePath $env:AHK2EXE_PATH `
            -ArgumentList @('/in', 'keyboard-fixer.ahk', '/out', 'keyboard-fixer.exe', '/base', $env:AHK_BASE_PATH) `
            -NoNewWindow -Wait -PassThru

          Write-Host "Ahk2Exe real exit code: $($proc.ExitCode)"
          Write-Host "--- Current directory contents ---"
          Get-ChildItem

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path "keyboard-fixer.exe")) {
            Write-Error "keyboard-fixer.exe was not created."
            exit 1
          }
          Get-Item "keyboard-fixer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-fixer
          path: keyboard-fixer.exe
