name: Build EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install AutoHotkey
        run: choco install autohotkey -y --no-progress
      - name: Compile to EXE
        run: |
          & "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe" /in keyboard-fixer.ahk /out keyboard-fixer.exe
      - name: Verify EXE
        run: |
          if (-not (Test-Path "keyboard-fixer.exe")) {
            Write-Error "keyboard-fixer.exe was not created."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-fixer
          path: keyboard-fixer.exe
