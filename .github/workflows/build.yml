name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 and Ahk2Exe
        uses: holy-tao/install-autohotkey@v2
        with:
          version: '2.0.19'
          compiler: 'latest'

      - name: Compile keyboard-fixer.ahk
        shell: powershell
        run: |
          & "${{ github.workspace }}\autohotkey\Compiler\Ahk2Exe.exe" `
            /in "${{ github.workspace }}\keyboard-fixer.ahk" `
            /out "${{ github.workspace }}\keyboard-fixer.exe"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "AutoHotkey compilation failed."
            exit $LASTEXITCODE
          }

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path "keyboard-fixer.exe")) {
            Write-Error "keyboard-fixer.exe was not created."
            exit 1
          }

          Write-Host "EXE created successfully:"
          Get-Item "keyboard-fixer.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-fixer
          path: keyboard-fixer.exe
